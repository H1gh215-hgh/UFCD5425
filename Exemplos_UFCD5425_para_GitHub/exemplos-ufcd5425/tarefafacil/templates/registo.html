{% extends "base.html" %}
{% block titulo %}Criar conta · TarefaFácil{% endblock %}
{% block conteudo %}
<div class="pagina-autenticacao">
  <div class="cartao-autenticacao">
    <h1 class="titulo-app">📋 TarefaFácil</h1>
    <p class="subtitulo-autenticacao">Crie a sua conta gratuita</p>

    <form method="post" class="formulario">
      <div class="campo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" required autofocus>
      </div>
      <div class="campo">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="campo">
        <label for="password">Palavra-passe</label>
        <input type="password" id="password" name="password" required minlength="4">
        <span class="ajuda-campo">Mínimo de 4 caracteres</span>
      </div>
      <button type="submit" class="botao botao-principal">Criar conta</button>
    </form>

    <p class="ligacao-alternativa">
      Já tem conta? <a href="{{ url_for('rotas.login') }}">Iniciar sessão</a>
    </p>
  </div>
</div>
{% endblock %}
